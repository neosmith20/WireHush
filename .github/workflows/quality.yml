# CodeQL is enabled with GitHub Default Setup; a second Advanced Setup is rejected.
name: WireHush code quality and security

on:
  push:
    branches: [main, "fix/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-quality:
    name: Go formatting, vet and Staticcheck
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch pinned Go build dependencies
        shell: pwsh
        run: ./scripts/bootstrap-v1.ps1 -Scope Go
      - name: Verify Go formatting, vet and Staticcheck
        shell: pwsh
        run: ./scripts/check-go-quality.ps1

  dotnet-quality:
    name: C# formatting and compiler analyzers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch pinned .NET build dependencies
        shell: pwsh
        run: ./scripts/bootstrap-v1.ps1 -Scope DotNet
      - name: Verify formatting and analyzers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./.deps/dotnet/dotnet.exe restore windows-ui/WireHush.UI/WireHush.UI.csproj -p:Platform=x64 --locked-mode -v:q
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NuGet restore failed' }
          & ./.deps/dotnet/dotnet.exe format whitespace windows-ui/WireHush.UI/WireHush.UI.csproj --verify-no-changes --no-restore --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'C# formatting check failed' }
          & ./.deps/dotnet/dotnet.exe build windows-ui/WireHush.UI/WireHush.UI.csproj --no-restore -p:Platform=x64 -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest -warnaserror -v:q
          if ($LASTEXITCODE -ne 0) { throw 'C# analyzer/build check failed' }

  powershell-quality:
    name: PowerShell syntax and PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify pinned downloads fail safely and retry transient errors
        shell: pwsh
        run: ./scripts/test-pinned-download.ps1
      - name: Parse scripts and run static analysis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $files = @(Get-ChildItem scripts -Filter '*.ps1' -File -Recurse)
          $errors = @()
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $errors += @($parseErrors)
          }
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell parser errors' }
          $findings = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error,Warning)
          $findings | Format-Table -AutoSize | Out-Host
          if (@($findings | Where-Object Severity -EQ Error).Count -gt 0) { throw 'PSScriptAnalyzer errors' }

  workflow-quality:
    name: GitHub Actions actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
      - name: actionlint syntax and expressions
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: zizmor GitHub Actions security scan
        run: |
          python3 -m venv .quality-venv
          .quality-venv/bin/pip install --disable-pip-version-check zizmor==1.30.1
          .quality-venv/bin/zizmor --min-severity medium .github/workflows
