name: WireHush Windows owner-test builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate candidate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch checksum-pinned build tools
        shell: pwsh
        run: ./scripts/bootstrap-v1.ps1

      - name: Run V1 regression and safety checks
        shell: pwsh
        run: ./scripts/test-v1.ps1 -Race

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wirehush-validation-${{ github.sha }}
          path: .artifacts/v1/validation.txt
          if-no-files-found: warn
          retention-days: 90

  build:
    name: Build ${{ matrix.architecture }}
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch checksum-pinned build tools
        shell: pwsh
        run: ./scripts/bootstrap-v1.ps1

      - name: Build ${{ matrix.architecture }} owner-test installer
        shell: pwsh
        run: ./scripts/build-v1.ps1 -Architecture ${{ matrix.architecture }} -SkipBootstrap -Installer

      - name: Stage downloadable artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.architecture }}'
          $latestPath = ".artifacts/v1/$arch/latest.json"
          $latest = Get-Content -LiteralPath $latestPath -Raw | ConvertFrom-Json

          if ($latest.Commit.Trim() -ne '${{ github.sha }}') {
            throw "Artifact provenance mismatch: latest.json says $($latest.Commit), workflow SHA is ${{ github.sha }}"
          }

          $runRoot = Split-Path -Parent $latest.App
          $msi = @(Get-ChildItem -LiteralPath $runRoot -Filter "WireHush-*-$arch-test.msi" -File)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one $arch MSI under $runRoot; found $($msi.Count)"
          }

          $dist = ".artifacts/dist/$arch"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item -LiteralPath $msi[0].FullName -Destination $dist
          Copy-Item -LiteralPath $latestPath -Destination "$dist/latest.json"
          Copy-Item -LiteralPath "$runRoot/INSTALLER-SHA256SUMS.txt" -Destination "$dist/INSTALLER-SHA256SUMS.txt"

          @(
            'WireHush GitHub Actions owner-test build'
            "Architecture: $arch"
            "Commit: ${{ github.sha }}"
            "Ref: ${{ github.ref }}"
            "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ) | Set-Content -LiteralPath "$dist/BUILD-PROVENANCE.txt" -Encoding ascii

          $hash = (Get-FileHash -LiteralPath $msi[0].FullName -Algorithm SHA256).Hash
          "### WireHush $arch owner-test build" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "| File | SHA-256 |" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "| --- | --- |" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "| $($msi[0].Name) | `$hash` |" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload ${{ matrix.architecture }} installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wirehush-${{ matrix.architecture }}-${{ github.sha }}
          path: .artifacts/dist/${{ matrix.architecture }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download x64 build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wirehush-x64-\${{ github.sha }}
          path: .release-input/x64

      - name: Download ARM64 build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wirehush-arm64-\${{ github.sha }}
          path: .release-input/arm64

      - name: Stage permanent release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $x64 = @(Get-ChildItem -LiteralPath '.release-input/x64' -Recurse -Filter 'WireHush-*-x64-test.msi' -File)
          $arm64 = @(Get-ChildItem -LiteralPath '.release-input/arm64' -Recurse -Filter 'WireHush-*-arm64-test.msi' -File)
          if ($x64.Count -ne 1) { throw "Expected exactly one x64 MSI; found $($x64.Count)" }
          if ($arm64.Count -ne 1) { throw "Expected exactly one ARM64 MSI; found $($arm64.Count)" }

          $versionMatch = [regex]::Match($x64[0].Name, '^WireHush-(?<version>\d+\.\d+\.\d+)-x64-test\.msi$')
          if (!$versionMatch.Success) { throw "Unable to derive release version from $($x64[0].Name)" }
          $version = $versionMatch.Groups['version'].Value
          $expectedArm64 = "WireHush-$version-arm64-test.msi"
          if ($arm64[0].Name -ne $expectedArm64) {
            throw "Architecture build versions do not match: $($x64[0].Name) vs $($arm64[0].Name)"
          }

          $releaseDir = '.release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $x64ReleaseName = "WireHush-$version-x64.msi"
          $arm64ReleaseName = "WireHush-$version-arm64.msi"
          Copy-Item -LiteralPath $x64[0].FullName -Destination (Join-Path $releaseDir $x64ReleaseName)
          Copy-Item -LiteralPath $arm64[0].FullName -Destination (Join-Path $releaseDir $arm64ReleaseName)

          $assets = @(
            Get-Item -LiteralPath (Join-Path $releaseDir $x64ReleaseName)
            Get-Item -LiteralPath (Join-Path $releaseDir $arm64ReleaseName)
          )

          $assets | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath "$releaseDir/SHA256SUMS.txt" -Encoding ascii

          $short = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "v$version+$short"
          $name = "WireHush $version ($short)"

          @(
            'WireHush GitHub Release build'
            "Version: $version"
            "Commit: $env:GITHUB_SHA"
            "Tag: $tag"
            "Ref: $env:GITHUB_REF"
            "Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Architectures: x64, ARM64'
            'Signing: unsigned Windows installers'
          ) | Set-Content -LiteralPath "$releaseDir/BUILD-PROVENANCE.txt" -Encoding ascii

          @(
            "# $name"
            ''
            'Automated Windows release built and validated by GitHub Actions.'
            ''
            "- Version: $version"
            "- Source commit: $env:GITHUB_SHA"
            "- Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            '- Includes native x64 and ARM64 MSI installers'
            '- SHA-256 checksums are attached in SHA256SUMS.txt'
            '- Installers are currently unsigned'
          ) | Set-Content -LiteralPath "$releaseDir/RELEASE-NOTES.md" -Encoding utf8

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish full GitHub release
        shell: pwsh
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $assets = @(
            (Get-ChildItem -LiteralPath '.release' -Filter '*.msi' -File | Sort-Object Name | ForEach-Object FullName)
            (Resolve-Path -LiteralPath '.release/SHA256SUMS.txt').Path
            (Resolve-Path -LiteralPath '.release/BUILD-PROVENANCE.txt').Path
          )

          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to refresh GitHub release assets' }

            & gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_NAME --notes-file '.release/RELEASE-NOTES.md'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to refresh GitHub release metadata' }
          }
          else {
            & gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:RELEASE_NAME --notes-file '.release/RELEASE-NOTES.md'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to publish GitHub release' }
          }

