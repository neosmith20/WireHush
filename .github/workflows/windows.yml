name: WireHush V1 candidate
on:
  push:
    branches: [main, blueprint/wirehush-v1]
  pull_request:
    branches: [main, blueprint/wirehush-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch checksum-pinned build tools
        shell: pwsh
        run: ./scripts/bootstrap-v1.ps1
      - name: Run V1 regression and safety checks
        shell: pwsh
        run: ./scripts/test-v1.ps1
      - name: Package x64 and ARM64 owner-test candidates
        shell: pwsh
        run: ./scripts/build-v1.ps1 -SkipBootstrap -Installer
      - name: Upload unsigned candidates and validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wirehush-v1-owner-test
          path: |
            .artifacts/v1/*/*/*.msi
            .artifacts/v1/*/*/*SHA256SUMS.txt
            .artifacts/v1/*/latest.json
            .artifacts/v1/validation.txt
          if-no-files-found: error
