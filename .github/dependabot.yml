version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
  - package-ecosystem: nuget
    directory: "/windows-ui/WireHush.UI"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
  - package-ecosystem: nuget
    directory: "/protocol/csharp"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
